<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queen Shuby's 24th</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0b38;
    --surface: #2a1459;
    --surface-2: #381a73;
    --line: #5a37a6;
    --text: #f4eeff;
    --muted: #b9a6e6;
    --sun: #ffd23f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 28px 16px 72px;
    min-height: 100vh;
  }
  .wrap { width: min(600px, 100%); margin: 0 auto; }

  h1 {
    font-family: "Bagel Fat One", sans-serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 12vw, 3.8rem);
    line-height: 1.05;
    color: #c9a9ff;  /* light purple. Other options: #b388ff (brighter), #e0ccff (lighter) */
    text-shadow: 0 2px 0 #1a0b38, 0 0 14px rgba(26, 11, 56, .9);
  }
  .tag { display: inline-block; color: var(--text); background: rgba(26, 11, 56, .85); padding: 8px 14px; border-radius: 10px; margin: 12px 0 26px; }

  /* Route */
  ol.route { list-style: none; padding: 0; position: relative; display: grid; gap: 18px; }
  ol.route::before {
    content: ""; position: absolute; left: 21px; top: 20px; bottom: 20px; width: 4px;
    background: repeating-linear-gradient(to bottom, var(--line) 0 10px, transparent 10px 20px);
  }
  .stop { position: relative; padding-left: 58px; }
  .dot {
    position: absolute; left: 0; top: 14px; width: 46px; height: 46px; border-radius: 50%;
    background: var(--bg); border: 4px solid var(--accent); color: var(--accent);
    display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; z-index: 1;
  }
  .stop.open .dot { background: var(--accent); color: var(--bg); }

  .card {
    background: var(--surface); border: 2px solid var(--line); border-left: 8px solid var(--accent);
    border-radius: 14px; overflow: hidden;
  }
  .stop.open .card { border-color: var(--accent); }
  .pic { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; margin-top: 14px; border-radius: 10px; background: var(--surface-2); }
  .inner { padding: 16px 18px; }
  .head { all: unset; display: block; width: 100%; cursor: pointer; box-sizing: border-box; }
  .head:focus-visible { outline: 3px solid var(--sun); outline-offset: 6px; border-radius: 8px; }
  .when { font-weight: 700; color: var(--accent); font-size: .95rem; }
  .title { font-weight: 700; font-size: 1.2rem; margin-top: 2px; }
  .chev { float: right; color: var(--muted); transition: transform .25s; }
  .stop.open .chev { transform: rotate(180deg); }

  .body { display: none; margin-top: 12px; }
  .stop.open .body { display: block; animation: pop .3s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
  .body p { color: var(--muted); }
  .body p + .mystery { margin-top: 14px; }

  /* Mystery box */
  .mystery {
    display: grid; place-items: center; text-align: center; gap: 6px;
    min-height: 120px; padding: 16px;
    border: 2px dashed var(--accent); border-radius: 12px; background: var(--surface-2);
    cursor: pointer; font: inherit; color: var(--text); width: 100%;
  }
  .mystery:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .mystery .q { font-family: "Bagel Fat One", sans-serif; font-size: 3rem; line-height: 1; color: var(--accent); }
  .mystery.revealed { border-style: solid; cursor: default; animation: pop .4s ease; }
  .mystery.revealed .q { font-size: 1.4rem; font-family: "DM Sans", sans-serif; font-weight: 700; color: var(--text); }
  .mystery small { color: var(--muted); }
  .mystery .pic { margin-top: 0; max-height: 50vh; }

  /* Intro animation */
  body.locked { overflow: hidden; }
  body.locked .wrap { visibility: hidden; }
  .intro {
    position: fixed; inset: 0; z-index: 30;
    background: radial-gradient(circle at 50% 38%, #3a1a7a, #1a0b38 70%);
    display: grid; place-content: center; justify-items: center; text-align: center;
    gap: 14px; padding: 24px; overflow: hidden;
    transition: transform .8s cubic-bezier(.7, 0, .3, 1);
  }
  .intro.leave { transform: translateY(-100%); }
  .crown { width: 92px; animation: drop 1s cubic-bezier(.3, 1.5, .5, 1) .2s both; }
  @keyframes drop { from { transform: translateY(-60vh) rotate(-25deg); opacity: 0; } }
  .intro-title {
    font-family: "Bagel Fat One", sans-serif; font-weight: 400;
    font-size: clamp(2.6rem, 13vw, 4.4rem); line-height: 1.05; color: #c9a9ff;
    text-shadow: 0 2px 0 #1a0b38, 0 0 14px rgba(26, 11, 56, .9);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .28em;
  }
  .intro-title span { display: inline-block; animation: word .6s cubic-bezier(.3, 1.6, .5, 1) both; }
  .intro-title span:nth-child(1) { animation-delay: 1s; }
  .intro-title span:nth-child(2) { animation-delay: 1.25s; }
  .intro-title span:nth-child(3) { animation-delay: 1.5s; }
  .intro-title span:nth-child(4) { animation-delay: 1.8s; }
  @keyframes word { from { transform: scale(.3) translateY(30px); opacity: 0; } }
  .intro-sub { color: var(--muted); animation: fade .6s 2s both; }
  @keyframes fade { from { opacity: 0; } }
  .intro-btn {
    font: inherit; font-weight: 700; cursor: pointer; margin-top: 10px;
    padding: 14px 28px; border-radius: 999px; border: 2px solid var(--sun);
    background: var(--sun); color: var(--bg);
    animation: fade .6s 2.9s both;
  }
  .intro-btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .spark { position: absolute; color: var(--sun); animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .15; transform: scale(.6); } }

  /* One-time stagger when the plan appears */
  body.enter .stop { animation: rise .5s ease both; animation-delay: calc(var(--i) * 130ms + .35s); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }

  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="intro" id="intro" role="dialog" aria-label="Welcome">
  <span class="spark" style="left:12%;top:18%;font-size:1.6rem">✦</span>
  <span class="spark" style="right:14%;top:14%;font-size:1.1rem;animation-delay:.6s">✦</span>
  <span class="spark" style="left:20%;bottom:20%;font-size:1.2rem;animation-delay:1.1s">✦</span>
  <span class="spark" style="right:18%;bottom:24%;font-size:1.8rem;animation-delay:1.6s">✦</span>
  <span class="spark" style="left:50%;top:8%;font-size:.9rem;animation-delay:.3s">✦</span>
  <svg class="crown" viewBox="0 0 100 70" aria-hidden="true">
    <path d="M8 62 L2 14 L28 36 L50 6 L72 36 L98 14 L92 62 Z" fill="#ffd23f"/>
    <rect x="8" y="56" width="84" height="8" rx="3" fill="#e8b800"/>
    <circle cx="2" cy="14" r="5" fill="#ff7fa6"/><circle cx="50" cy="6" r="5" fill="#ff7fa6"/><circle cx="98" cy="14" r="5" fill="#ff7fa6"/>
  </svg>
  <h2 class="intro-title"><span>Queen</span><span>Shuby's</span><span>24th</span><span>Birthday!</span></h2>
  <button class="intro-btn" id="start" type="button">Open the plan</button>
</div>


<main class="wrap">
  <header>
    <h1>Queen Shuby's 24th!</h1>
    <p class="tag">Here is the plan for the day. Click on each box o</p>
  </header>
  <ol class="route" id="route"></ol>
</main>

<script>
/* ============ EDIT THIS BLOCK ============ */

// Background photo (optional). Put the file in an "images" folder, e.g. "images/bg.jpg". Leave "" for plain purple.
const BACKGROUND = "images/greyCat.jpg";

// Background picture for the opening screen (the crown animation). Leave "" for the purple glow.
const INTRO_BACKGROUND = "images/greyCat.jpg";

// For each stop, "img" is an optional picture, e.g. "images/stop1.jpg". Leave "" for none.
const STOPS = [
  { color: "#ffd23f", time: "1:00 PM", title: "Bobeu arrives at Shuby's house",
    text: "Bobeu arrive at Shuby's house at 1pm o", img: "images/gift.jpg" },
  { color: "#7cc4ff", time: "2:45 PM", title: "Leave together from Shuby maoo's house o",
    text: "Bring your student card yea hehe", img: "images/walking.jpg" },
  { color: "#b79cff", time: "Afternoon", title: "Meowstery activity at Geylang",
    mystery: true, reveal: "hey heyy, already say its a meowstery le o", img: "images/confuse.gif" },
  { color: "#ff7fa6", time: "Evening", title: "Lovely dinner together at Chinatown",
    text: "mmm delicious mlem mlem", img: "" }
];
/* ========================================= */

const $ = id => document.getElementById(id);
let state = { open: null, revealed: [] };  // fresh every visit: all cards closed, mystery hidden
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

if (BACKGROUND) {
  document.body.style.backgroundImage =
    "linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.3)), url('" + BACKGROUND + "')";
  document.body.style.backgroundSize = "cover, contain";
  document.body.style.backgroundPosition = "center";
  document.body.style.backgroundRepeat = "no-repeat";
  document.body.style.backgroundAttachment = "fixed";
}

const route = $("route");
function render() {
  route.innerHTML = "";
  STOPS.forEach((st, i) => {
    const open = state.open === i;
    const revealed = state.revealed.includes(i);
    const li = document.createElement("li");
    li.className = "stop" + (open ? " open" : "");
    li.style.setProperty("--accent", st.color);
    li.style.setProperty("--i", i);
    const pic = st.img ? `<img class="pic" src="${esc(st.img)}" alt="" loading="lazy">` : "";
    const mystery = st.mystery ? `
      <button class="mystery${revealed ? " revealed" : ""}" data-reveal="${i}" ${revealed ? "disabled" : ""}>
        <span class="q">${revealed ? esc(st.reveal) : "?"}</span>
        ${revealed ? pic : ""}
        ${revealed ? (st.place ? `<small>${esc(st.place)}</small>` : "") : "<small>Tap to reveal</small>"}
      </button>` : "";
    li.innerHTML = `
      <div class="dot" aria-hidden="true">${i + 1}</div>
      <div class="card">
        <div class="inner">
          <button class="head" data-open="${i}" aria-expanded="${open}">
            <span class="chev" aria-hidden="true">▾</span>
            <div class="when">${esc(st.time)}</div>
            <div class="title">${esc(st.title)}</div>
          </button>
          <div class="body">
            <p>${esc(st.text)}</p>
            ${mystery}
            ${st.mystery ? "" : pic}
          </div>
        </div>
      </div>`;
    route.appendChild(li);
  });
}

route.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.open !== undefined) {
    const i = +t.dataset.open;
    state.open = state.open === i ? null : i;
  } else if (t.dataset.reveal !== undefined) {
    const i = +t.dataset.reveal;
    if (!state.revealed.includes(i)) state.revealed.push(i);
    if (!reduce) burst();
  }
  render();
  const h = route.querySelector(".stop.open .head");
  if (t.dataset.open !== undefined && h) h.focus({ preventScroll: true });
});

/* Confetti (only on reveal) */
const cvs = $("confetti"), ctx = cvs.getContext("2d");
let bits = [];
function size() { cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", size); size();
function burst() {
  const colors = ["#ffd23f", "#ff7fa6", "#7cc4ff", "#5eead0", "#b79cff"];
  for (let i = 0; i < 70; i++) bits.push({
    x: innerWidth / 2, y: innerHeight * .45,
    vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 3,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
    r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: colors[i % colors.length], life: 120 + Math.random() * 50
  });
  requestAnimationFrame(tick);
}
function tick() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  bits = bits.filter(b => b.life-- > 0 && b.y < cvs.height + 20);
  for (const b of bits) {
    b.vy += .35; b.x += b.vx; b.y += b.vy; b.vx *= .99; b.r += b.vr;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
    ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
  }
  if (bits.length) requestAnimationFrame(tick);
}

/* Intro */
const intro = $("intro"), startBtn = $("start");
document.body.classList.add("locked");
if (INTRO_BACKGROUND) {
  intro.style.background = "linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.45)) center / cover no-repeat, url('" + INTRO_BACKGROUND + "') center / contain no-repeat #1a0b38";
}
if (!reduce) setTimeout(() => { if (intro.isConnected && !intro.classList.contains("leave")) burst(); }, 2400);
setTimeout(() => startBtn.focus({ preventScroll: true }), reduce ? 0 : 3000);
startBtn.addEventListener("click", () => {
  intro.classList.add("leave");
  document.body.classList.remove("locked");
  document.body.classList.add("enter");
  scrollTo(0, 0);
  if (!reduce) burst();
  setTimeout(() => { intro.remove(); document.body.classList.remove("enter"); }, reduce ? 0 : 1600);
});

render();
</script>
</body>
</html>
