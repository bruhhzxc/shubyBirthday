<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited!</title>
<meta property="og:title" content="You're invited to a birthday party!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1446;
    --paper: #ede7ff;
    --sun: #ffd23f;
    --pink: #ff5d8f;
    --mint: #3ddbb0;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 24px 16px 48px;
    overflow-x: hidden;
  }
  .stage { width: min(440px, 100%); text-align: center; }

  /* Envelope */
  .envelope {
    all: unset;
    cursor: pointer;
    display: block;
    width: 100%;
    margin-bottom: 8px;
  }
  .envelope:focus-visible { outline: 4px solid var(--pink); outline-offset: 6px; border-radius: 16px; }
  .env-body {
    position: relative;
    height: 220px;
    background: var(--pink);
    border: 4px solid var(--ink);
    border-radius: 16px;
    box-shadow: 8px 8px 0 var(--ink);
    overflow: hidden;
    transition: transform .4s ease;
  }
  .env-body::before, .env-body::after {
    content: ""; position: absolute; bottom: 0; width: 50%; height: 100%;
    background: #ff7fa6;
  }
  .env-body::before { left: 0; clip-path: polygon(0 0, 100% 100%, 0 100%); }
  .env-body::after { right: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .flap {
    position: absolute; inset: 0 0 auto 0; height: 62%;
    background: var(--sun);
    border-bottom: 4px solid var(--ink);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: transform .6s ease;
    z-index: 2;
  }
  .seal {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--ink); color: var(--sun);
    font-family: "Bagel Fat One", sans-serif; font-size: 30px;
    display: grid; place-items: center; z-index: 3;
    transition: opacity .3s;
  }
  .hint { margin-top: 20px; font-weight: 700; font-size: 1.05rem; }
  .hint span { display: inline-block; animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(-5px); } }

  .opened .flap { transform: rotateX(180deg); }
  .opened .seal { opacity: 0; }
  .opened .env-body { transform: translateY(-6px); }
  .opened .hint { display: none; }

  /* Card */
  .card {
    display: none;
    background: var(--white);
    border: 4px solid var(--ink);
    border-radius: 24px;
    box-shadow: 10px 10px 0 var(--ink);
    padding: 36px 28px 32px;
    margin-top: 28px;
    text-align: center;
  }
  .opened + .card, .card.show { display: block; animation: rise .7s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { transform: translateY(40px) rotate(-3deg); opacity: 0; } }

  .kicker { font-weight: 500; font-size: 1.05rem; }
  .age {
    font-family: "Bagel Fat One", sans-serif;
    font-size: clamp(7rem, 38vw, 10.5rem);
    line-height: .9;
    color: var(--pink);
    -webkit-text-stroke: 4px var(--ink);
    paint-order: stroke fill;
    text-shadow: 6px 6px 0 var(--sun);
    margin: 8px 0 4px;
  }
  .name { font-family: "Bagel Fat One", sans-serif; font-size: 2rem; line-height: 1.1; }
  .tagline { margin: 12px auto 24px; max-width: 30ch; line-height: 1.5; }

  .details { text-align: left; display: grid; gap: 10px; margin: 0 0 24px; padding: 0; list-style: none; }
  .details li {
    display: grid; grid-template-columns: 5.5em 1fr; gap: 10px; align-items: baseline;
    padding: 12px 14px; border: 3px solid var(--ink); border-radius: 12px;
  }
  .details li:nth-child(1) { background: #fff3c4; }
  .details li:nth-child(2) { background: #d4f7ec; }
  .details li:nth-child(3) { background: #ffe0ea; }
  .details b { font-weight: 700; }

  .actions { display: grid; gap: 12px; }
  .btn {
    display: block; text-decoration: none; cursor: pointer; font: inherit; font-weight: 700;
    padding: 14px 18px; border: 3px solid var(--ink); border-radius: 999px;
    background: var(--ink); color: var(--white);
    box-shadow: 4px 4px 0 var(--pink);
    transition: transform .12s, box-shadow .12s;
  }
  .btn.alt { background: var(--white); color: var(--ink); box-shadow: 4px 4px 0 var(--mint); }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--pink); }
  .btn.alt:hover { box-shadow: 2px 2px 0 var(--mint); }
  .btn:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
  .note { margin-top: 18px; font-size: .9rem; }

  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="stage">
  <button class="envelope" id="env" aria-label="Open your invitation">
    <div class="env-body"><div class="flap"></div><div class="seal">&#10022;</div></div>
    <p class="hint"><span>Tap to open</span></p>
  </button>

  <article class="card" id="card" aria-live="polite">
    <p class="kicker" id="kicker"></p>
    <div class="age" id="age"></div>
    <h1 class="name" id="name"></h1>
    <p class="tagline" id="tagline"></p>

    <ul class="details">
      <li><b>When</b><span id="when"></span></li>
      <li><b>Where</b><span id="where"></span></li>
      <li><b>Dress code</b><span id="dress"></span></li>
    </ul>

    <div class="actions">
      <a class="btn" id="rsvp" href="#">RSVP</a>
      <a class="btn alt" id="cal" href="#" download="birthday.ics">Add to calendar</a>
      <a class="btn alt" id="map" href="#" target="_blank" rel="noopener">Open map</a>
    </div>
    <p class="note" id="note"></p>
  </article>
</main>

<script>
/* ============ EDIT THIS BLOCK ============ */
const PARTY = {
  kicker: "You're invited to celebrate",
  name: "Alex's Birthday",
  age: "25",
  tagline: "Cake, games and good people. Come hungry.",
  // Local date/time: year, month (1-12), day, hour (24h), minute
  start: { y: 2026, m: 11, d: 14, h: 18, min: 0 },
  durationHours: 4,
  venueName: "Alex's place, Blk 123 Example Street #05-01",
  mapQuery: "Singapore",           // address or place name for the map button
  dress: "Come as you are, or wear something yellow",
  rsvpBy: "7 Nov",
  // Pick ONE RSVP method:
  rsvpWhatsApp: "",                  // e.g. "6591234567" (country code, no + or spaces)
  rsvpEmail: "you@example.com",
  note: "Please let us know about any food allergies."
};
/* ========================================= */

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const s = PARTY.start;
const startDate = new Date(s.y, s.m - 1, s.d, s.h, s.min);
const endDate = new Date(startDate.getTime() + PARTY.durationHours * 3600e3);

$("kicker").textContent = PARTY.kicker;
$("age").textContent = PARTY.age;
$("name").textContent = PARTY.name;
$("tagline").textContent = PARTY.tagline;
$("where").textContent = PARTY.venueName;
$("dress").textContent = PARTY.dress;
$("note").textContent = (PARTY.rsvpBy ? "Please reply by " + PARTY.rsvpBy + ". " : "") + PARTY.note;
$("when").textContent =
  startDate.toLocaleDateString("en-SG", { weekday: "long", day: "numeric", month: "long" }) + ", " +
  startDate.toLocaleTimeString("en-SG", { hour: "numeric", minute: "2-digit" });
document.title = "You're invited: " + PARTY.name;

$("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(PARTY.mapQuery);

const msg = "Hi! I'm coming to " + PARTY.name + ".";
$("rsvp").href = PARTY.rsvpWhatsApp
  ? "https://wa.me/" + PARTY.rsvpWhatsApp + "?text=" + encodeURIComponent(msg)
  : "mailto:" + PARTY.rsvpEmail + "?subject=" + encodeURIComponent("RSVP: " + PARTY.name) + "&body=" + encodeURIComponent(msg);

// Calendar file (floating local time, so it lands at the right clock time)
const ics = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
const icsText = [
  "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Invitation//EN", "BEGIN:VEVENT",
  "UID:" + ics(startDate) + "@invitation",
  "DTSTAMP:" + ics(new Date()),
  "DTSTART:" + ics(startDate), "DTEND:" + ics(endDate),
  "SUMMARY:" + PARTY.name, "LOCATION:" + PARTY.venueName.replace(/,/g, "\\,"),
  "END:VEVENT", "END:VCALENDAR"
].join("\r\n");
$("cal").href = "data:text/calendar;charset=utf-8," + encodeURIComponent(icsText);

// Open envelope + confetti (the one big moment)
const env = $("env"), card = $("card"), cvs = $("confetti"), ctx = cvs.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let bits = [];
function size() { cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", size); size();

function burst() {
  const colors = ["#ff5d8f", "#ffd23f", "#3ddbb0", "#1a1446", "#ffffff"];
  for (let i = 0; i < 140; i++) {
    bits.push({
      x: innerWidth / 2, y: innerHeight * 0.35,
      vx: (Math.random() - .5) * 16, vy: Math.random() * -14 - 3,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: colors[i % colors.length], life: 140 + Math.random() * 60
    });
  }
  requestAnimationFrame(tick);
}
function tick() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  bits = bits.filter(b => b.life-- > 0 && b.y < cvs.height + 20);
  for (const b of bits) {
    b.vy += .35; b.x += b.vx; b.y += b.vy; b.vx *= .99; b.r += b.vr;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
    ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
  }
  if (bits.length) requestAnimationFrame(tick);
}

env.addEventListener("click", () => {
  env.classList.add("opened");
  setTimeout(() => { card.classList.add("show"); card.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); }, 450);
  if (!reduce) burst();
}, { once: true });
</script>
</body>
</html>
